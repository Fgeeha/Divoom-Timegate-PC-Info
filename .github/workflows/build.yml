name: build

on:
  push:
  pull_request:

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: divoom-pc-monitor-linux
            binary: dist/divoom-pc-monitor
          - os: windows-latest
            artifact: divoom-pc-monitor-windows
            binary: dist/divoom-pc-monitor.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lm-sensors

      - name: Install project and tools
        run: pip install .[dev] pyinstaller

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Build standalone binary
        run: pyinstaller --onefile --name divoom-pc-monitor src/divoom_pc_monitor/__main__.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: divoom-pc-monitor-linux
          path: artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: divoom-pc-monitor-windows
          path: artifacts/windows

      - name: Stage release assets
        run: |
          mv artifacts/linux/divoom-pc-monitor artifacts/divoom-pc-monitor-linux
          mv artifacts/windows/divoom-pc-monitor.exe artifacts/divoom-pc-monitor-windows.exe

      - name: Build deb package
        run: |
          sudo gem install fpm --no-document -q
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x artifacts/divoom-pc-monitor-linux
          fpm -s dir -t deb \
            -n divoom-pc-monitor \
            -v "$VERSION" \
            --architecture amd64 \
            --description "Cross-platform PC monitor for Divoom Times Gate pixel clock" \
            --url "https://github.com/Fgeeha/Divoom-Timegate-PC-Info" \
            --maintainer "anon <anon@localhost>" \
            "artifacts/divoom-pc-monitor-linux=/usr/bin/divoom-pc-monitor" \
            "config.example.toml=/usr/share/divoom-pc-monitor/config.example.toml"
          mv divoom-pc-monitor_*.deb artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/divoom-pc-monitor-linux
            artifacts/divoom-pc-monitor-windows.exe
            artifacts/*.deb
          generate_release_notes: true
